<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Frank Li’s personal website.">
  <meta name="color-scheme" content="light">
  <title>Frank Li</title>
  <style>
    @font-face { font-family: "Latin Modern Roman"; src: url("fonts/lmroman10-regular.otf") format("opentype"); font-style: normal; font-weight: 400; font-display: swap; }
    * { box-sizing: border-box; }
    html { color-scheme: light; background-color: #ffffff; }
    body { margin: 0; min-height: 100vh; font-family: "Latin Modern Roman", "Times New Roman", serif; color: #000000; background-color: #ffffff; }
    main { max-width: 640px; margin: 96px auto; padding: 0 24px; }
    img { display: block; width: 112px; height: 112px; object-fit: cover; object-position: center 38%; border-radius: 50%; margin-bottom: 24px; }
    p { margin: 0; font-size: 18px; line-height: 1.5; }
    a { color: #285a88; text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:hover { color: #173c5c; }
    a:focus-visible { outline: 2px solid #285a88; outline-offset: 4px; }
    @media (max-width: 480px) { main { margin-top: 56px; } }
  </style>
</head>
<body>
  <main>
    <img src="frank-li.jpg" alt="Frank Li" width="112" height="112">
    <p>Hi, I'm Frank Li. Reach me at <a href="mailto:frank7li@engineering.upenn.edu" aria-label="Email Frank Li" title="frank7li@engineering.upenn.edu">frank7li@engineering[.]upenn[.]edu</a>.</p>
  </main>
</body>
</html>
